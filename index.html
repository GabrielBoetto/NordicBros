<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidratación Nórdica</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <img src="./media/Logo Completo 2 Nordic Bros (1).png" alt="Logo de la Marca" class="logo">
            <ul>
                <li><a href="#productos">Productos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
        <div class="hero">
            <h1>Hidratación Nórdica</h1>
            <p>El entrenamiento va por vos, la hidratación por NordicBros. ¡10% de descuento si tu compra supera los $50.000!</p>
        </div>
    </header>

    <section id="productos" class="productos">
        <h2>Nuestros Productos</h2>
        <div class="grid">
            
        </div>
        <button id="calcular">Calcular Total</button>
        <button id="limpiar">Limpiar Carrito</button>
        <p id="total"></p>
    </section>
    

    <footer id="contacto">
        <p>© 2025 NORDIC BROS. Todos los derechos reservados.</p>
        <p><a href="https://www.youtube.com/watch?v=BBJa32lCaaY&ab_channel=LegacyPNDA" target="_blank">Contacto y descuento especial!</a></p>
    </footer>

    <script src="./js/index.js"></script>
</body>
</html>
